name: verify
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: chmod scripts
        run: chmod +x ./scripts/* || true
      - name: setup
        run: ./scripts/setup
      - name: verify
        run: ./scripts/verify
